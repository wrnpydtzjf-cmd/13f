name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  # 关键修复：update.yml 用 GITHUB_TOKEN 推送的 commit 不会触发本仓库的 push 事件，
  # 因此监听其 workflow_run 完成事件，确保每日股价更新后站点自动重新部署。
  workflow_run:
    workflows: ["Update 13F Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # push / workflow_dispatch 直接部署；workflow_run 仅在 update.yml 成功时部署
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
